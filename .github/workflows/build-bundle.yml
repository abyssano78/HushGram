# Builds the HushGram patch bundle (.mpp) from the source in this repository, so the bundle
# Morphe Manager installs is the one compiled here, not a binary built elsewhere.
#
# - Every push and manual run: build, then upload the .mpp and its SHA-256 as a run artifact.
# - On main only: publish a GitHub release in this fork and point patches-bundle.json at it,
#   so Morphe Manager (Sources > + > Remote > github.com/<this fork>) downloads this build.
name: Build bundle

on:
  push:
    branches: [main, ccr-c3e058ae-vfpfxs]
    paths-ignore: ['patches-bundle.json']
  workflow_dispatch:

permissions:
  contents: write   # create the release and commit patches-bundle.json on main
  packages: read    # Morphe's Gradle plugin comes from GitHub Packages

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./gradlew --no-daemon :patches:buildAndroid

      - name: Locate the bundle
        id: bundle
        run: |
          version=$(grep -E '^version *=' gradle.properties | sed -E 's/^version *= *//')
          file="patches/build/release/patches-${version}.mpp"
          test -s "$file"
          unzip -l "$file" | grep -q 'classes.dex' || { echo "bundle has no classes.dex"; exit 1; }
          sha256sum "$file" | tee "$file.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hushgram-${{ steps.bundle.outputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.bundle.outputs.file }}
            ${{ steps.bundle.outputs.file }}.sha256

      - name: Publish release and point Morphe at it
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bundle.outputs.version }}
          FILE: ${{ steps.bundle.outputs.file }}
        run: |
          short=$(git rev-parse --short HEAD)
          tag="v${VERSION}-fork.${short}"
          name=$(basename "$FILE")
          gh release create "$tag" "$FILE" "$FILE.sha256" \
            --title "HushGram ${VERSION} (built from ${short})" \
            --notes "Built by GitHub Actions from commit ${GITHUB_SHA} of ${GITHUB_REPOSITORY}. SHA-256: $(cut -d' ' -f1 "$FILE.sha256")" \
            --target "$GITHUB_SHA"
          python3 - "$tag" "$name" <<'PY'
          import json, sys, datetime, os
          tag, name = sys.argv[1], sys.argv[2]
          repo = os.environ["GITHUB_REPOSITORY"]
          with open("patches-bundle.json") as f:
              data = json.load(f)
          data["download_url"] = f"https://github.com/{repo}/releases/download/{tag}/{name}"
          data["signature_download_url"] = ""
          data["created_at"] = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%S")
          with open("patches-bundle.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: point patches-bundle.json at ${tag}"
          git push origin HEAD:main
